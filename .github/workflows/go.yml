name: Go

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.7"

      - name: Build Linux
        env:
          GOOS: linux
          GOARCH: amd64
        run: go build -o dist/orca-linux-amd64 ./cmd/cli 

      - name: Build Windows
        env:
          GOOS: windows
          GOARCH: amd64
        run: go build -o dist/orca-windows-amd64.exe ./cmd/cli


      - name: Build macOS
        env:
          GOOS: darwin
          GOARCH: amd64
        run: go build -o dist/orca-darwin-amd64 ./cmd/cli

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: go-builds
          path: dist/
